name: Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          
      - name: Generate Coverage
        working-directory: ./apps/web
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts
          npm run test:coverage

      - name: Install Playwright Browsers
        working-directory: ./apps/web
        run: pnpm run test:e2e:install

      - name: Run Playwright tests
        working-directory: ./apps/web
        run: pnpm run test:e2e

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: beerpong
          POSTGRES_PASSWORD: beerpong_ci
          POSTGRES_DB: beerpong
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beerpong"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://beerpong:beerpong_ci@localhost:5432/beerpong
      # Scratch database for the concurrency tests that need real row locks (tables are dropped)
      TEST_POSTGRES_URL: postgresql+asyncpg://beerpong:beerpong_ci@localhost:5432/beerpong_test
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create scratch database
        run: psql "postgresql://beerpong:beerpong_ci@localhost:5432/beerpong" -c "CREATE DATABASE beerpong_test"

      - name: Run migrations on an empty database
        run: uv run alembic upgrade head

      - name: Run API tests
        run: uv run pytest -v

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      
      - name: Build Web Docker image (dry run)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/web
          push: false
          
      - name: Build API Docker image (dry run)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/api
          push: false