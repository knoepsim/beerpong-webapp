name: Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          
      - name: Generate Coverage
        working-directory: ./apps/web
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts
          npm run test:coverage

      - name: Install Playwright Browsers
        working-directory: ./apps/web
        run: pnpm run test:e2e:install

      - name: Run Playwright tests
        working-directory: ./apps/web
        run: pnpm run test:e2e

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  api-tests:
    name: API Tests
    # Self-hosted runner (runs as a container). A container job puts the job and its services on the
    # same Docker network, so PostgreSQL is reachable as host "postgres" instead of localhost.
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: beerpong
          POSTGRES_PASSWORD: beerpong_ci
          POSTGRES_DB: beerpong
        options: >-
          --health-cmd "pg_isready -U beerpong"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://beerpong:beerpong_ci@postgres:5432/beerpong
      # Scratch database for the concurrency tests that need real row locks (tables are dropped)
      TEST_POSTGRES_URL: postgresql+asyncpg://beerpong:beerpong_ci@postgres:5432/beerpong_test
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create scratch database
        run: |
          uv run python - <<'EOF'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect("postgresql://beerpong:beerpong_ci@postgres:5432/beerpong")
              await conn.execute("CREATE DATABASE beerpong_test")
              await conn.close()

          asyncio.run(main())
          EOF

      - name: Run migrations on an empty database
        run: uv run alembic upgrade head

      - name: Run API tests
        run: uv run pytest -v

  docker-build-check:
    name: Docker Build Check
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      
      - name: Build Web Docker image (dry run)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/web
          push: false
          
      - name: Build API Docker image (dry run)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/api
          push: false